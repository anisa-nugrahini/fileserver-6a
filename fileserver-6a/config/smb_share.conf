# Blok share Samba (ditambahkan ke /etc/samba/smb.conf oleh scripts/setup.sh --install-configs)
# Disarankan di [global]: server min protocol = SMB2 ; map to guest = never ; log level = 1
[shared]
   comment = Berkas Bersama Unit Kerja
   path = /srv/fileserver/share
   browseable = yes
   guest ok = no
   valid users = @sf_operator, @sf_reader
   read only = yes
   write list = @sf_operator
   force group = sf_operator
   create mask = 0660
   directory mask = 2770
   inherit acls = yes
   # Catatan: akun harus lolos Samba (valid users) DAN permission/ACL Linux.
