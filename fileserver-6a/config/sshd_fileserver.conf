# Drop-in: /etc/ssh/sshd_config.d/50-fileserver.conf
# PERINGATAN: AllowGroups membatasi login. Pastikan akun admin VM Anda ada di salah satu grup
# (grup 'sudo' sudah disertakan) dan SELALU jalankan `sshd -t` + pertahankan sesi SSH yang terbuka.
PermitRootLogin no
MaxAuthTries 3
X11Forwarding no
AllowGroups sf_admin sf_operator sf_reader sudo
